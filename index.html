<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Argazo SL</title>
    <meta name="description" content="Argazo crea soluciones sencillas.">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --parchment: #f2e8d5;
            --parchment-dark: #e5d9c3;
            --sea-deep: #2c4a52;
            --sea-mid: #4a7c7c;
            --kelp: #3d4a3a;
            --driftwood: #8b7355;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 18px;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background-color: #f2e8d5;
            background-image: url("background.jpg");
            background-size: cover;
            background-position: right center;
            color: var(--sea-deep);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .content-area {
            max-width: 560px;
            padding: 3rem 4rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            padding-bottom: 2rem;
        }

        .logo {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.2rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            color: var(--sea-deep);
            text-transform: uppercase;
        }

        /* Main content */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .tagline {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.8rem;
            font-weight: 400;
            line-height: 1.15;
            margin-bottom: 1.5rem;
            color: var(--sea-deep);
        }

        .tagline em {
            font-style: italic;
            color: var(--sea-mid);
        }

        .mission {
            font-size: 1.05rem;
            line-height: 1.7;
            color: var(--kelp);
            margin-bottom: 2.5rem;
        }

        .contact-link {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--sea-deep);
            text-decoration: none;
            padding: 0.9rem 1.6rem;
            border: 2px solid var(--sea-deep);
            border-radius: 2px;
            transition: all 0.25s ease;
            letter-spacing: 0.02em;
        }

        .contact-link:hover {
            background: var(--sea-deep);
            color: var(--parchment);
        }

        .contact-link svg {
            width: 18px;
            height: 18px;
        }

        /* Footer */
        footer {
            padding: 2rem 0;
            border-top: 1px solid var(--parchment-dark);
        }

        .footer-content {
            font-size: 0.85rem;
            color: var(--driftwood);
        }

        .footer-content span {
            display: block;
        }

        .footer-location {
            font-style: italic;
            margin-top: 0.25rem;
        }

        /* Responsive */
        @media (max-width: 900px) {
            body {
                background-position: center top;
                background-size: auto 40vh;
                background-attachment: scroll;
            }

            .content-area {
                max-width: 100%;
                padding: 2rem;
                padding-top: 42vh;
                min-height: auto;
            }
        }

        @media (max-width: 500px) {
            html {
                font-size: 16px;
            }

            .content-area {
                padding: 1.5rem;
                padding-top: 38vh;
            }

            .tagline {
                font-size: 2.2rem;
            }
        }

        /* Subtle entrance animation */
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        main {
            animation: fadeUp 0.8s ease-out;
        }
    </style>
</head>
<body>
    <div class="content-area">
        <header>
            <div class="logo">Argazo</div>
        </header>

        <main>
            <h1 class="tagline">Creamos<br><em>soluciones sencillas.</em></h1>
            <p class="mission">
                Software, aplicaciones y herramientas digitales — diseñadas para resolver problemas reales sin complejidad innecesaria.
            </p>
            <a href="https://wa.me/34600000000" class="contact-link" target="_blank">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
                </svg>
                WhatsApp
            </a>
        </main>

        <footer>
            <div class="footer-content">
                <span>© 2026 Argazo SL</span>
                <span class="footer-location">A Coruña, España</span>
            </div>
        </footer>
    </div>
</body>
</html>
